name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python syntax
        run: python3 -m compileall -q tools

      - name: Shell syntax
        run: |
          for f in *.sh decomp tools/*.sh tools/decomp/*.sh tools/decomp/permuter/*.sh; do
            bash -n "$f"
          done

      - name: Project config parses
        run: python3 -c "import sys; sys.path.insert(0, 'tools/decomp'); import projcfg; print(projcfg.FILE_NAME)"
